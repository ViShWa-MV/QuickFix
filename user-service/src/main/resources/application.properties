# user-service configuration.
# Secrets come from the environment (see .env.example). Defaults below are for
# local development only; production must set every ${...} without a default.

spring.application.name=user-service
server.port=${SERVER_PORT:8081}

# Database (schema is managed by Flyway; Hibernate only validates it)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickfix_user}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Google sign-in
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:564752045039-dc8plg2sdlq9uden7g0l0d1cgefufgvf.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Tokens issued to the SPA (shared secret with catalog and booking)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Where the browser lives (sign-in redirect and CORS)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

quickfix.internal-key=${INTERNAL_API_KEY}
