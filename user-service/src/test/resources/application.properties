# Tests: in-memory H2 with the schema created by Hibernate; no Flyway, no secrets.
spring.datasource.url=jdbc:h2:mem:userdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
jwt.secret=test-only-jwt-secret-at-least-thirty-two-bytes-long
jwt.expiration=3600000
app.frontend-url=http://localhost:5173

quickfix.internal-key=test-internal-key
