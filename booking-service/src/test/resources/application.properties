# Test configuration: in-memory H2, fixed test secrets, no external services.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-jwt-secret-at-least-thirty-two-bytes-long
quickfix.internal-key=test-internal-key
app.frontend-url=http://localhost:5173
catalog.base-url=http://localhost:8082

# Flyway runs in production-like runs; the H2 test database is built by Hibernate.
spring.flyway.enabled=false

# Paging: default and maximum page sizes for list endpoints.
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=100

# Address lookups are stubbed in tests.
user.base-url=http://localhost:9
